en:
  title: Closing Soon at the Daifuku Shop
  tentative: true
  cover: ./closing-soon/cover-en.jpg
  # TODO: 英語版 book.yaml の description が未記入のため、日本語版からの仮訳。確定版に差し替える
  description: |
    For twelve years, a sign on the glass door of Togawa, a tiny daifuku shop at the end of a shopping street, has read "Closing in seven days." Nobody took it seriously. But this winter, with the old row house scheduled for demolition, the number has finally started to go down.
    A twenty-eight-year-old about to quit a job. A forty-four-year-old facing the last day of seeing a daughter as family. A seventeen-year-old still on awkward terms with a best friend who is moving away. A sixty-seven-year-old with two days to clear out a childhood home now that Mother is gone. And a man who has not been able to open the shop's door in more than twenty years. Five people, each trying to bring something to an end, come to buy daifuku "one last time." The taciturn owner, Haru, asks no questions and offers no comfort, and simply says, "So, how many?"
    Five linked stories, each told by a different narrator.
