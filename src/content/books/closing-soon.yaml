ja:
  title: 閉店まであと七日の和菓子屋さん
  cover: ./closing-soon/cover-ja.jpg
  description: |
    商店街の端の豆大福屋「とがわ」のガラス戸には、十二年前から「閉店まであと七日」の貼り紙がある。誰も本気にしていなかったその数字が、長屋の取り壊しが決まったこの冬、初めて減りはじめた。
    会社を辞める二十八歳。家族として娘に会う最後の日を迎える四十四歳。引っ越す親友と気まずいままの十七歳。母のいなくなった実家を二日で片づける六十七歳。そして、二十年あまりこの店の戸を開けられなかった男。何かを終わらせようとしている五人が、「最後だから」と豆大福を買いに来る。口数の少ない店主のハルは事情を聞かず、慰めもせず、ただ「で、いくつ？」と訊く。
    一話ずつ主人公が替わる、五つの話の連作短編集。
